<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Volley Match Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configurazione Tailwind per supportare il dark mode basato su classe
        tailwind.config = { darkMode: 'class' }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <!-- PULIZIA AUTOMATICA CACHE -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) { registration.unregister(); }
            });
        }
        if ('caches' in window) {
            caches.keys().then(function (names) {
                for (let name of names) { caches.delete(name); }
            });
        }
        // Applicazione immediata tema salvato per evitare sfarfallii
        if (localStorage.getItem('volley_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body
    class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 antialiased min-h-screen pb-24 transition-colors duration-200">

    <!-- 1. SCHERMATA LOGIN -->
    <div id="view-auth" class="max-w-md mx-auto p-4 mt-6">
        <div
            class="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 text-center space-y-5">
            <img src="logoasdo.png" alt="Logo Societa" class="w-20 h-20 mx-auto object-contain drop-shadow-sm"
                onerror="this.style.display='none'">
            <div>
                <h1 class="text-xl font-bold text-slate-800 dark:text-white">Volley Match Manager</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Inserisci nome e cognome per accedere</p>
            </div>

            <div class="space-y-3 text-left">
                <div>
                    <label for="authNome"
                        class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Nome</label>
                    <input type="text" id="authNome" placeholder="Es. Martina"
                        class="w-full p-3.5 border dark:border-slate-600 rounded-2xl text-sm bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label for="authCognome"
                        class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Cognome</label>
                    <input type="text" id="authCognome" placeholder="Es. Aprigliano"
                        class="w-full p-3.5 border dark:border-slate-600 rounded-2xl text-sm bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="button" onclick="eseguiLogin()"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-3.5 rounded-2xl shadow-sm transition active:scale-95 cursor-pointer mt-2">
                    Accedi all'App
                </button>
            </div>
        </div>
    </div>

    <!-- 2. SCHERMATA PRINCIPALE (DASHBOARD) -->
    <div id="view-dashboard" style="display: none;" class="max-w-md mx-auto space-y-4 relative">

        <!-- Header con Icona Hamburger a sinistra, Profilo al centro/sinistra e Lampadina a destra -->
        <header
            class="bg-indigo-600 dark:bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-40 flex justify-between items-center rounded-b-2xl transition-colors duration-200">
            <div class="flex items-center space-x-3">
                <!-- Bottone Menu a 3 linee (Hamburger stilizzato) -->
                <button type="button" onclick="toggleSidebar(true)"
                    class="p-2 rounded-xl hover:bg-indigo-700 dark:hover:bg-indigo-800 transition cursor-pointer flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>

                <!-- Avatar Profilo stilizzato -->
                <div
                    class="w-10 h-10 rounded-full bg-indigo-500 dark:bg-indigo-800 border-2 border-indigo-300 dark:border-indigo-600 flex items-center justify-center text-white shadow-inner">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <div>
                    <h1 id="currentUserDisplay" class="font-bold text-base leading-tight">Utente</h1>
                    <p id="currentUserRole" class="text-xs text-indigo-200">Ruolo</p>
                </div>
            </div>

            <!-- Pulsante Lampadina per Modalità Chiara / Scura in alto a destra -->
            <button type="button" onclick="toggleTheme()"
                class="p-2.5 rounded-2xl bg-indigo-700/60 dark:bg-indigo-800/80 hover:bg-indigo-700 border border-indigo-500/40 transition active:scale-95 cursor-pointer text-amber-300 shadow-sm"
                title="Cambia Tema">
                <!-- Icona Lampadina Vettoriale -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z">
                    </path>
                </svg>
            </button>
        </header>

        <!-- MENU LATERALE A SCOMPARSA (DRAWER) -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity"
            onclick="toggleSidebar(false)"></div>
        <aside id="sidebarDrawer"
            class="fixed top-0 left-0 bottom-0 w-72 bg-white dark:bg-slate-800 z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col justify-between p-6">
            <div class="space-y-6">
                <div class="flex justify-between items-center border-b dark:border-slate-700 pb-4">
                    <h2 class="font-bold text-indigo-600 dark:text-indigo-400 text-lg">Menu Squadra</h2>
                    <button type="button" onclick="toggleSidebar(false)"
                        class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-2xl font-bold">&times;</button>
                </div>

                <nav class="space-y-2">
                    <button type="button" onclick="mostraSezione('calendario')"
                        class="w-full text-left px-4 py-3 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium transition flex items-center space-x-3 cursor-pointer">
                        <!-- Icona Calendario Vettoriale -->
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                        <span>Calendario Partite</span>
                    </button>
                    <button type="button" onclick="mostraSezione('riepilogo')"
                        class="w-full text-left px-4 py-3 rounded-xl hover:bg-indigo-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium transition flex items-center space-x-3 cursor-pointer">
                        <!-- Icona Grafico/Tracker Vettoriale -->
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                            </path>
                        </svg>
                        <span>Dettaglio Presenze Partita</span>
                    </button>
                </nav>
            </div>

            <!-- Pulsante Logout in basso nel menu -->
            <div class="border-t dark:border-slate-700 pt-4">
                <button type="button" onclick="logoutUser()"
                    class="w-full bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-700 dark:text-rose-300 font-medium py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2 cursor-pointer">
                    <!-- Icona Logout Vettoriale -->
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                    <span>Esci (Logout)</span>
                </button>
            </div>
        </aside>

        <!-- CONTENUTO DINAMICO DELLE SEZIONI -->
        <main class="p-4 space-y-4">

            <!-- SEZIONE 1: CALENDARIO -->
            <div id="section-calendario" class="space-y-4">
                <button type="button" onclick="toggleMatchForm()"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-2xl shadow-sm flex items-center justify-center space-x-2 active:scale-95 transition-transform cursor-pointer">
                    <span>+ Aggiungi Nuova Partita</span>
                </button>

                <!-- Form Partita (Modale Centrato) -->
                <section id="matchFormContainer"
                    class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
                    <div
                        class="bg-slate-900 border border-slate-700 w-full max-w-md p-6 rounded-2xl shadow-2xl space-y-4 animate-in fade-in zoom-in duration-200">
                        <div class="flex justify-between items-center">
                            <h2 id="formTitle" class="font-bold text-lg text-white">Nuova Partita</h2>
                            <button type="button" onclick="toggleMatchForm()"
                                class="text-slate-400 hover:text-white p-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12">
                                    </path>
                                </svg>
                            </button>
                        </div>

                        <form id="matchForm" class="space-y-4">
                            <input type="hidden" id="matchId">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Squadra Avversaria</label>
                                <input type="text" id="avversario" placeholder="Es. Omate" required
                                    class="w-full p-3 border border-slate-700 rounded-xl text-sm bg-slate-800 text-white focus:outline-none focus:border-indigo-500">
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Data e Ora</label>
                                <div class="w-full overflow-hidden">
                                    <input type="datetime-local" id="dataOra" required
                                        class="w-full h-[46px] px-3 border border-slate-700 rounded-xl text-sm bg-slate-800 text-white focus:outline-none focus:border-indigo-500 box-border text-left"
                                        style="max-width: 100%; -webkit-appearance: none;">
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Luogo</label>
                                <select id="luogo"
                                    class="w-full p-3 border border-slate-700 rounded-xl text-sm bg-slate-800 text-white focus:outline-none focus:border-indigo-500">
                                    <option value="Casa">Casa</option>
                                    <option value="Trasferta">Trasferta</option>
                                </select>
                            </div>

                            <div class="flex space-x-3 pt-2">
                                <button type="submit"
                                    class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium p-3 rounded-xl transition cursor-pointer">Salva</button>
                                <button type="button" onclick="toggleMatchForm()"
                                    class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 rounded-xl transition cursor-pointer">Annulla</button>
                            </div>
                        </form>
                    </div>
                </section>
                <!-- Lista Partite -->
                <section>
                    <h2 class="font-semibold text-slate-600 dark:text-slate-400 mb-3">Calendario Partite</h2>
                    <div id="matchList" class="space-y-3">
                        <!-- Popolato da JS -->
                    </div>
                </section>
            </div>

            <!-- SEZIONE 2: DETTAGLIO PRESENZE E RUOLI PER PARTITA -->
            <div id="section-riepilogo" class="space-y-4 hidden">
                <div
                    class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-3">
                    <h2 class="font-bold text-slate-800 dark:text-white text-base">Seleziona Partita</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Scegli la partita per visualizzare i convocati
                        e il conteggio dei ruoli.</p>
                    <select id="selectPartitaRiepilogo" onchange="caricaDettaglioPartita(this.value)"
                        class="w-full p-3 border dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white">
                        <option value="">-- Seleziona una partita --</option>
                    </select>
                </div>

                <!-- Box Risultati Dettaglio -->
                <div id="dettaglioPartitaContainer" class="space-y-4 hidden">
                    <!-- Lista Presenti e Assenti -->
                    <div
                        class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
                        <h3 id="dettaglioTitoloMatch"
                            class="font-bold text-indigo-600 dark:text-indigo-400 text-sm uppercase tracking-wide"></h3>

                        <div>
                            <h4 class="text-xs font-bold text-emerald-700 dark:text-emerald-400 mb-2 uppercase">Presenti
                            </h4>
                            <div id="listaPresentiDettaglio" class="space-y-1.5 text-sm">
                                <!-- Popolato da JS -->
                            </div>
                        </div>

                        <div class="border-t dark:border-slate-700 pt-3">
                            <h4 class="text-xs font-bold text-rose-700 dark:text-rose-400 mb-2 uppercase">Assenti</h4>
                            <div id="listaAssentiDettaglio" class="space-y-1.5 text-sm">
                                <!-- Popolato da JS -->
                            </div>
                        </div>
                    </div>

                    <!-- Conteggio Ruoli in basso -->
                    <div
                        class="bg-indigo-900 dark:bg-indigo-950 text-white p-4 rounded-2xl shadow-sm space-y-3 border border-indigo-800">
                        <h3 class="font-bold text-xs uppercase tracking-wider text-indigo-200">Conteggio Ruoli Presenti
                        </h3>
                        <div id="conteggioRuoliDettaglio" class="grid grid-cols-2 gap-2 text-sm font-medium">
                            <!-- Popolato da JS -->
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Modale Presenza Rapida -->
    <div id="presenceModal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div
            class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-xl border dark:border-slate-700">
            <h3 id="modalMatchTitle" class="font-bold text-lg text-slate-800 dark:text-white">Conferma Presenza</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400" id="modalMatchInfo"></p>

            <div class="space-y-2 pt-2">
                <span class="block text-xs font-semibold text-slate-600 dark:text-slate-300">Ci sarai?</span>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="updatePresence(true)"
                        class="p-3 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 font-semibold border border-emerald-200 dark:border-emerald-800 rounded-xl active:scale-95 cursor-pointer">
                        Si, ci sono
                    </button>
                    <button type="button" onclick="updatePresence(false)"
                        class="p-3 bg-rose-50 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 font-semibold border border-rose-200 dark:border-rose-800 rounded-xl active:scale-95 cursor-pointer">
                        No, assente
                    </button>
                </div>
            </div>
            <button type="button" onclick="closePresenceModal()"
                class="w-full mt-2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 py-2.5 rounded-xl text-sm cursor-pointer">Chiudi</button>
        </div>
    </div>

    <script src="app.js?v=style4"></script>
</body>

</html>
